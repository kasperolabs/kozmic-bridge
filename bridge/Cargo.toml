[package]
name = "bridge-covenant"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
description = "Kaspa ZK bridge: compiles bridge.sil (Silverscript) and builds its spend scripts"
publish = false

[[bin]]
name = "bridge-covenant"
path = "src/main.rs"

[dependencies]
# Silverscript at the commit that switched to rusty-kaspa 2.1.0 crates (2026-10-10).
silverscript-lang = { git = "https://github.com/kaspanet/silverscript", rev = "a0dd7448ccc7bad5b99140f2c8edbbd0b2a874f1" }
silverscript-abi = { git = "https://github.com/kaspanet/silverscript", rev = "a0dd7448ccc7bad5b99140f2c8edbbd0b2a874f1" }
kaspa-consensus-core = "=2.1.0"
kaspa-txscript = "=2.1.0"
kaspa-txscript-zk-sdk = "=2.1.0"
kaspa-txscript-errors = "=2.1.0"
risc0-zkvm = { version = "=3.0.4", default-features = false }
borsh = "1.5"
hex = "0.4"
serde_json = "1.0"
sha2 = "0.10"
secp256k1 = { version = "0.29", features = ["global-context", "rand-std"] }
