[workspace]
resolver = "2"
members = ["host", "methods"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Pinned to the exact risc0 version the Kaspa SDK v2.1.0 embeds (control root + VK must match).
[workspace.dependencies]
risc0-zkvm = { version = "=3.0.4" }
risc0-build = { version = "3.0" }
borsh = { version = "1.5", features = ["derive"] }
hex = "0.4"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }

[profile.release]
debug = 1
lto = true
