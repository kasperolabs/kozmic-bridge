[package]
name = "burnwitness"
version = "0.1.0"
edition = "2024"
publish = false
description = "Builds the outbound relay witness (O1) for a burned-KAS transaction from a rusty-kaspa node: superblock ladders from a checkpoint to a tip, and the KIP-21 sequencing-commitment path from the burn to the tip, every value cross-checked against the node's own crates"

# Pinned to the same rusty-kaspa release the bridge is built against (same pins as outbound/dagwalk).
[dependencies]
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.1.0" }
kaspa-pow = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.1.0" }
kaspa-hashes = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.1.0" }
kaspa-rpc-core = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.1.0" }
kaspa-wrpc-client = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.1.0" }
kaspa-seq-commit = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.1.0" }
kaspa-smt = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.1.0" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
hex = "0.4"
# U4: the reference cell's P2SH hash and template hash (cells.rs)
blake2b_simd = "1"
blake3 = "1"

[profile.release]
opt-level = 3
