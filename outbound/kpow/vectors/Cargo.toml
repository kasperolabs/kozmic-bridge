[package]
name = "kpow-vectors"
version = "0.1.0"
edition = "2024"
publish = false
description = "Dumps Kaspa mainnet headers plus every PoW intermediate, computed by rusty-kaspa v2.1.0, as test vectors for the Solidity port"

# Pinned to the same rusty-kaspa release the bridge is built against.
[dependencies]
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.1.0" }
kaspa-pow = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.1.0" }
kaspa-hashes = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.1.0" }
kaspa-math = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.1.0" }
kaspa-rpc-core = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.1.0" }
kaspa-wrpc-client = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.1.0" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
hex = "0.4"

[profile.release]
opt-level = 3
