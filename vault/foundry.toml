[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Ethereum mainnet is the only target. The RPC URL carries an API key and lives in
# ../eth-rpc-url.txt; pass it as --rpc-url $(cat ../eth-rpc-url.txt), never commit it.
[rpc_endpoints]

[lint]
lint_on_build = false
