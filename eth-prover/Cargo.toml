[workspace]
members = ["primitives", "methods", "host"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
eth-bridge-primitives = { path = "primitives" }
eth-bridge-methods = { path = "methods" }

# risc0: must stay at 3.0.4 (the Kaspa SDK 2.1.0 embeds this version's control root)
risc0-zkvm = { version = "=3.0.4", features = ["unstable"] }
risc0-build = { version = "=3.0.4", features = ["unstable"] }

# helios: 0.12.0 has Fulu + Gloas fork support (Sepolia is post-Fusaka)
helios-consensus-core = { git = "https://github.com/a16z/helios", tag = "0.12.0" }
helios-ethereum = { git = "https://github.com/a16z/helios", tag = "0.12.0" }

alloy = { version = "2.1.0", default-features = false }
alloy-primitives = "1.6"
alloy-rlp = { version = "0.3", default-features = false, features = ["derive", "arrayvec"] }
alloy-trie = { version = "0.9", features = ["ethereum"] }
tree_hash = "0.10"
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11.2"
serde_json = "1"
hex = "0.4"
anyhow = "1"
eyre = "0.6"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenv = "0.15"
sha2 = "0.10"

[patch.crates-io]
ethereum_hashing = { git = "https://github.com/ncitron/ethereum_hashing", rev = "7ee70944ed4fabe301551da8c447e4f4ae5e6c35" }
