[package]
name = "eth-bridge-guest"

[lib]
name = "eth_bridge_guest"
path = "src/lib.rs"
version = "0.1.0"
edition = "2021"

[workspace]

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[dependencies]
risc0-zkvm = { version = "=3.0.4", default-features = false, features = ["std", "unstable"] }
eth-bridge-primitives = { path = "../../primitives" }
helios-consensus-core = { git = "https://github.com/a16z/helios", tag = "0.12.0" }
alloy-primitives = "1.6"
alloy-rlp = { version = "0.3", default-features = false, features = ["derive", "arrayvec"] }
alloy-trie = { version = "0.9", features = ["ethereum"] }
tree_hash = "0.10"
serde_cbor = "0.11.2"
serde = { version = "1", features = ["derive"] }

[patch.crates-io]
# RISC Zero accelerated forks. Versions must match the crate versions in the lock file.
bls12_381 = { git = "https://github.com/risc0/zkcrypto-bls12_381", tag = "bls12_381/v0.8.0-risczero.1" }
sha2-v0-9-9 = { git = "https://github.com/risc0/RustCrypto-hashes", package = "sha2", tag = "sha2-v0.9.9-risczero.0" }
sha2-v0-10-9 = { git = "https://github.com/risc0/RustCrypto-hashes", package = "sha2", tag = "sha2-v0.10.9-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }
# helios needs this (not on crates.io in the shape it wants)
ethereum_hashing = { git = "https://github.com/ncitron/ethereum_hashing", rev = "7ee70944ed4fabe301551da8c447e4f4ae5e6c35" }
